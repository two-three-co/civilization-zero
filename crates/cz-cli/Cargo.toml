[package]
name = "cz-cli"
description = "Command-line runner for Civilization Zero experiments"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

# build.rs records the compiler for `RUN.json` (`CZ_RUSTC_VERSION`).
build = "build.rs"

[[bin]]
name = "cz"
path = "src/main.rs"

[features]
default = []
parallel = ["simulation-core/parallel"]

[dependencies]
simulation-core = { path = "../simulation-core" }
multiverse = { path = "../multiverse" }
cz-lab = { path = "../cz-lab" }
serde.workspace = true
serde_json.workspace = true
