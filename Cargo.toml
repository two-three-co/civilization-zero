[workspace]
resolver = "2"
members = ["crates/simulation-core", "crates/multiverse", "crates/cz-cli", "crates/cz-wasm-probe", "crates/cz-web"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
rust-version = "1.82"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Compact, serde-based, wire-stable binary format for snapshots (ADR-0006).
postcard = { version = "1", default-features = false, features = ["alloc"] }
rayon = "1"
proptest = "1"
criterion = { version = "0.5", default-features = false, features = ["cargo_bench_support"] }

[profile.release]
debug = 1

# The kernel stays at full optimisation when the browser build lowers the
# profile's opt-level for size (web/package.json's build:wasm sets
# CARGO_PROFILE_RELEASE_OPT_LEVEL=z; a package override outranks the
# profile's level): the published wasm then runs the kernel at opt-level 3
# speed inside a 397 KB binary (ADR-0014 D12, 4-9; measured in STATUS).
# A no-op for native release builds, whose opt-level is 3 anyway.
[profile.release.package.simulation-core]
opt-level = 3

[profile.bench]
debug = 1

# Browser build of the kernel (ADR-0009): no debug info, LTO, single codegen unit.
[profile.wasm]
inherits = "release"
debug = false
strip = true
lto = true
codegen-units = 1
opt-level = 3
