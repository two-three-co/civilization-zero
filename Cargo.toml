[workspace]
resolver = "2"
members = ["crates/simulation-core", "crates/cz-cli", "crates/cz-wasm-probe"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
rust-version = "1.82"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rayon = "1"
proptest = "1"
criterion = { version = "0.5", default-features = false, features = ["cargo_bench_support"] }

[profile.release]
debug = 1

[profile.bench]
debug = 1

# Browser build of the kernel (ADR-0009): no debug info, LTO, single codegen unit.
[profile.wasm]
inherits = "release"
debug = false
strip = true
lto = true
codegen-units = 1
opt-level = 3
