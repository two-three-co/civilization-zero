<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CZ Trace Viewer</title>
<style>
  :root {
    --bg: #f6f5f1; --panel: #ffffff; --ink: #1d1d1b; --muted: #6b6a65; --line: #dcdad3;
    --food: 46, 125, 50; --forager: #c2410c; --random: #1d4ed8; --sel: #000;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #151514; --panel: #1f1f1d; --ink: #ecebe6; --muted: #9a9890; --line: #33322f;
      --food: 102, 187, 106; --forager: #fb923c; --random: #60a5fa; --sel: #fff; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink);
    font: 14px/1.45 ui-sans-serif, system-ui, -apple-system, sans-serif; }
  header { padding: 12px 16px; border-bottom: 1px solid var(--line); display: flex; gap: 12px;
    align-items: baseline; flex-wrap: wrap; }
  header h1 { font-size: 15px; margin: 0; font-weight: 600; }
  header span { color: var(--muted); font-size: 12px; }
  main { display: grid; grid-template-columns: minmax(0, 1fr) 300px; gap: 16px; padding: 16px; }
  @media (max-width: 820px) { main { grid-template-columns: 1fr; } }
  .stage { background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 8px; }
  canvas#world { width: 100%; height: auto; image-rendering: pixelated; display: block; cursor: crosshair; }
  .controls { display: flex; gap: 8px; align-items: center; margin-top: 8px; flex-wrap: wrap; }
  .controls input[type=range] { flex: 1; min-width: 120px; }
  button, select { font: inherit; padding: 4px 10px; border: 1px solid var(--line); border-radius: 4px;
    background: var(--bg); color: var(--ink); cursor: pointer; }
  aside { display: flex; flex-direction: column; gap: 12px; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 10px 12px; }
  .card h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted);
    margin: 0 0 6px; font-weight: 600; }
  dl { display: grid; grid-template-columns: auto 1fr; gap: 2px 12px; margin: 0;
    font-variant-numeric: tabular-nums; }
  dt { color: var(--muted); } dd { margin: 0; text-align: right; }
  canvas#spark { width: 100%; height: 60px; display: block; }
  .legend { display: flex; gap: 12px; font-size: 12px; color: var(--muted); flex-wrap: wrap; }
  .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 4px; }
  .drop { padding: 40px 16px; text-align: center; color: var(--muted); }
  code { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px; }
</style>
</head>
<body>
<header>
  <h1>Civilization Zero · trace viewer</h1>
  <span id="meta">no trace loaded</span>
</header>
<main>
  <section class="stage">
    <div id="drop" class="drop">
      Load a trace produced by <code>cz run --trace out/trace.json</code><br><br>
      <input type="file" id="file" accept=".json">
    </div>
    <canvas id="world" hidden></canvas>
    <div class="controls">
      <button id="play" disabled>Play</button>
      <input type="range" id="scrub" min="0" max="0" value="0" disabled>
      <select id="speed"><option>1</option><option selected>4</option><option>15</option><option>30</option></select>
      <span id="tick">tick –</span>
    </div>
    <div class="legend" style="margin-top:6px">
      <span><i class="dot" style="background:var(--forager)"></i>forager</span>
      <span><i class="dot" style="background:var(--random)"></i>random baseline</span>
      <span>green = food per cell · dot opacity = energy</span>
    </div>
  </section>
  <aside>
    <div class="card"><h2>World</h2><dl id="stats"></dl></div>
    <div class="card"><h2>Population over trace</h2><canvas id="spark"></canvas></div>
    <div class="card"><h2>Agent (click map)</h2><dl id="agent"><dt>–</dt><dd></dd></dl></div>
  </aside>
</main>
<script>
const F = 8; // fields per agent: id x y energy inventory policy health age
const $ = (id) => document.getElementById(id);
const css = (n) => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
let trace = null, frame = 0, playing = false, selected = null, timer = null, img = null;
const SCALE = 4;

function hexAt(s, i) { return parseInt(s.substr(i * 2, 2), 16); }

function load(t) {
  if (t.format !== 2) throw new Error("unsupported trace format " + t.format);
  trace = t;
  const c = $("world");
  c.width = t.width * SCALE; c.height = t.height * SCALE; c.hidden = false;
  $("drop").hidden = true;
  img = new ImageData(t.width, t.height);
  $("scrub").max = t.frames.length - 1; $("scrub").disabled = false; $("play").disabled = false;
  $("meta").textContent = `${t.width}×${t.height} grid · ${t.frames.length} frames · ticks ${t.frames[0].tick}–${t.frames.at(-1).tick}`;
  drawSpark(); show(0);
}

function show(i) {
  frame = i; $("scrub").value = i;
  const f = trace.frames[i], w = trace.width, h = trace.height;
  const [fr, fg, fb] = css("--food").split(",").map(Number);
  const bg = css("--panel");
  const ctx = $("world").getContext("2d");
  // food layer at 1px per cell, then scaled up
  const d = img.data;
  for (let k = 0; k < w * h; k++) {
    const a = Math.min(1, hexAt(f.food, k) / 20);
    d[k * 4] = fr; d[k * 4 + 1] = fg; d[k * 4 + 2] = fb; d[k * 4 + 3] = Math.round(a * 200);
  }
  const off = new OffscreenCanvas(w, h); off.getContext("2d").putImageData(img, 0, 0);
  ctx.imageSmoothingEnabled = false;
  ctx.fillStyle = bg; ctx.fillRect(0, 0, w * SCALE, h * SCALE);
  ctx.drawImage(off, 0, 0, w * SCALE, h * SCALE);
  const ag = f.agents, cf = css("--forager"), cr = css("--random");
  let energy = 0, inv = 0;
  for (let k = 0; k < ag.length; k += F) {
    const e = ag[k + 3] / trace.max_energy;
    energy += ag[k + 3]; inv += ag[k + 4];
    ctx.globalAlpha = 0.25 + 0.75 * e;
    ctx.fillStyle = ag[k + 5] ? cr : cf;
    ctx.fillRect(ag[k + 1] * SCALE + 0.5, ag[k + 2] * SCALE + 0.5, SCALE - 1, SCALE - 1);
  }
  ctx.globalAlpha = 1;
  const n = ag.length / F;
  let food = 0; for (let k = 0; k < w * h; k++) food += hexAt(f.food, k);
  $("tick").textContent = `tick ${f.tick}`;
  $("stats").innerHTML = row("alive", n) + row("food on map", food) +
    row("food carried", inv) + row("mean energy", n ? (energy / n / 1000).toFixed(1) + " k" : "–");
  drawSelected(f, ctx);
}

function row(k, v) { return `<dt>${k}</dt><dd>${v}</dd>`; }

function drawSelected(f, ctx) {
  if (selected === null) return;
  const ag = f.agents;
  for (let k = 0; k < ag.length; k += F) if (ag[k] === selected) {
    ctx.strokeStyle = css("--sel"); ctx.lineWidth = 1.5;
    ctx.strokeRect(ag[k + 1] * SCALE - 3, ag[k + 2] * SCALE - 3, SCALE + 6, SCALE + 6);
    $("agent").innerHTML = row("id", ag[k]) + row("pos", `${ag[k + 1]}, ${ag[k + 2]}`) +
      row("energy", ag[k + 3]) + row("health", ag[k + 6]) + row("inventory", ag[k + 4]) +
      row("age", ag[k + 7]) + row("policy", ag[k + 5] ? "random" : "forager");
    return;
  }
  $("agent").innerHTML = row("id", selected) + row("status", "not alive in this frame");
}

function drawSpark() {
  const c = $("spark"), r = c.getBoundingClientRect(), dpr = devicePixelRatio || 1;
  c.width = r.width * dpr; c.height = r.height * dpr;
  const ctx = c.getContext("2d"); ctx.scale(dpr, dpr);
  const ys = trace.frames.map((f) => f.agents.length / F), max = Math.max(1, ...ys);
  ctx.strokeStyle = css("--forager"); ctx.lineWidth = 1.5; ctx.beginPath();
  ys.forEach((y, i) => {
    const x = (i / Math.max(1, ys.length - 1)) * r.width, yy = r.height - 4 - (y / max) * (r.height - 18);
    i ? ctx.lineTo(x, yy) : ctx.moveTo(x, yy);
  });
  ctx.stroke();
  ctx.fillStyle = css("--muted"); ctx.font = "11px system-ui"; ctx.fillText(`max ${max}`, 2, 11);
}

$("world").addEventListener("click", (ev) => {
  const r = ev.target.getBoundingClientRect();
  const x = ((ev.clientX - r.left) / r.width) * trace.width, y = ((ev.clientY - r.top) / r.height) * trace.height;
  const ag = trace.frames[frame].agents; let best = null, bd = 9;
  for (let k = 0; k < ag.length; k += F) {
    const dd = (ag[k + 1] + 0.5 - x) ** 2 + (ag[k + 2] + 0.5 - y) ** 2;
    if (dd < bd) { bd = dd; best = ag[k]; }
  }
  selected = best; show(frame);
});
$("scrub").addEventListener("input", (e) => show(+e.target.value));
$("play").addEventListener("click", () => {
  playing = !playing; $("play").textContent = playing ? "Pause" : "Play";
  clearInterval(timer);
  if (playing) timer = setInterval(() => {
    if (frame >= trace.frames.length - 1) { $("play").click(); return; }
    show(frame + 1);
  }, 1000 / +$("speed").value);
});
$("speed").addEventListener("change", () => { if (playing) { $("play").click(); $("play").click(); } });
$("file").addEventListener("change", async (e) => {
  try { load(JSON.parse(await e.target.files[0].text())); } catch (err) { alert(err.message); }
});
const q = new URLSearchParams(location.search).get("trace");
if (q) fetch(q).then((r) => r.json()).then(load).catch((err) => { $("meta").textContent = "load failed: " + err.message; });
</script>
</body>
</html>
